<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css">

    <style>
        .btn-login.ativo {
            background-color: #ffc107 !important;
            color: #000000 !important;
            border-color: #ffc107 !important;
        }
    </style>
</head>
<body>
  <div class="login-container">
    
    <div class="login-left">
      <div class="login-header">
        <i class="fa-solid fa-lock lock-icon"></i>
        <h1>Login</h1>
      </div>

      <form action="dashboard.html" method="get" class="login-form">
        <div class="input-group">
          <label><i class="fa-regular fa-envelope"></i> E-mail</label>
          <input type="email" name="email" id="email" required>
        </div>

        <div class="input-group">
          <label><i class="fa-regular fa-eye"></i> Senha</label>
          <input type="password" name="senha" id="senha" minlength="8" maxlength="12" required>
        </div>

        <div class="forgot-password">
          <a href="senha.html">Esqueceu a Senha?</a>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">Fazer Login</button>

        <div class="signup-footer">
          Não possui uma conta? <a href="index.html">Crie uma aqui.</a>
        </div>
      </form>
    </div>

    <div class="login-right">
      <img src="assets/images/unnamed.png" alt="Ilustração" class="bg-image">
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const btnLogin = document.getElementById('btnLogin');

    function verificarCampos() {
        if (emailInput.value.trim() !== '' && senhaInput.value.trim() !== '') {
            btnLogin.classList.add('ativo');
        } else {
            btnLogin.classList.remove('ativo');
        }
    }

    emailInput.addEventListener('input', verificarCampos);
    senhaInput.addEventListener('input', verificarCampos);
  </script>
  <script src="assets/js/login.js"></script>
</body>
</html>
