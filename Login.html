<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control Da Silva - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="index-container">

        <div class="index-left">
            <div class="index-header">
                <i class="bi bi-box-arrow-in-right lock-icon fs-1 text-primary"></i>
                <h1>Acesse sua Conta</h1>
                <img src="assets/images/logo-smart.png" alt="logo" style="border-radius: 50%; max-width: 180px; width: 100%;">
            </div> 

            <div class="index-form">
                <div id="alerta-login" class="alert d-none" role="alert"></div>

                <form id="form-login">
                    <div class="input-group mb-3">
                        <label for="login_email">E-mail ou CPF:</label>
                        <input type="text" id="login_email" placeholder="Digite seu e-mail ou CPF..." required class="form-control">
                    </div>

                    <div class="input-group mb-3">
                        <label for="login_senha">Senha:</label>
                        <input type="password" id="login_senha" placeholder="Sua senha..." required class="form-control">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" id="btn-login-demo" class="btn btn-secondary w-50">Login Automático (Demo)</button>
                        <button type="submit" class="btn btn-primary w-50">Entrar</button>
                    </div>

                    <div class="signup-footer mt-3">Não possui uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                    </div>
                </form>
            </div>
        </div> 

        <div class="index-right">
            <img src="assets/images/unnamed.png" alt="Ilustração" class="bg-image">
        </div> 

    </div>

    <script src="assets/js/login.js"></script>        
</body>
</html>
