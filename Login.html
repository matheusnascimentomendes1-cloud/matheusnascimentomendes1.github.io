<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Smart Control Da Silva</title>
</head>
<body>
    <header>
        <h1>Página de Login</h1>
        <img src="assets/images/unnamed 2.jpg" alt="logo" style="border-radius: 50%; width: 20vw;">
    </header>
    <h2>Faça Login</h2>
    <form method="get" action="dashboard.html">
        <label for="email">Email</label>
     <input type="email" name="email" id="email" required>

     <label for="senha">Senha</label>
         <input type="password" name="senha" id="senha" minlength="8" maxlength="10" required>

         <button type="submit">Log in /Ir para o Dashboard</button>
    </form>
    <a href="index.html">Cadastrar-Se</a>
