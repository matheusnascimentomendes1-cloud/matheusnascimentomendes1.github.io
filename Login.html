<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  

  <div class="login-container">
    
    <div class="login-left">
      <div class="login-header">
        <i class="fa-solid fa-lock lock-icon"></i>
        <h1>Login</h1>

      </div>
      <form action="dashboard.html" method="get">

      <form class="login-form">
        <div class="input-group">
          <label><i class="fa-regular fa-envelope"></i> E-mail</label>
          <input type="email" required>
        </div>

        <div class="input-group">
          <label><i class="fa-regular fa-eye"></i> Senha</label>
          <input type="password" required>
        </div>

        <div class="forgot-password">
          <a href="#">Esqueceu a Senha?</a>
        </div>

        <button type="submit" class="btn-login">Fazer Login</button>

        <div class="signup-footer">
          Não possui uma conta? <a href="index.html">Crie uma aqui.</a>
        </div>
      </form>
    </div>
    <div class="login-right">
      <img src="assets/images/unnamed.png" alt="Ilustração" class="bg-image">
    </div>
  </div>

</body>
</html>
