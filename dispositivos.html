<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Dispositivos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        .bg-dark-header { background-color: #1a1d21; }
        .text-gold { color: #ffc107; }
        .texto-white { color: #ffffff; }
        .cursor-pointer { cursor: pointer; }

        .offcanvas-amarelo {
            background-color: #f7d038 !important;
            color: #000 !important;
        }

        .btn-menu-navegacao {
            background-color: #3b3b3b;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 500;
            text-align: left;
            transition: background-color 0.2s;
            border: none;
        }

        .btn-menu-navegacao:hover {
            background-color: #262626;
            color: #ffffff;
        }

        .menu-perfil-card {
            background-color: #3b3b3b;
            border-radius: 16px;
            color: #ffffff;
            padding: 20px;
            width: 250px;
            border: none;
        }

        .menu-perfil-card .btn-perfil-opcao {
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            text-decoration: none;
            font-weight: 500;
        }

        .menu-perfil-card .btn-perfil-opcao i {
            color: #f7d038;
            font-size: 1.2rem;
        }

        .avatar-perfil {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffc107;
        }

        .card-linha {
            background-color: #f8f9fa;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .card-linha:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(255,255,255,0.1);
            background-color: #ffffff;
            color: inherit;
        }

        .icone-dispositivo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #212529;
        }

        .texto-nome { color: #212529; }
    </style>
</head>
<body class="bg-dark d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark-header px-4 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <button class="btn text-white p-0 fs-3 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuNavegacao">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-2 m-0 cursor-pointer">
                    <span class="fw-bold fs-4"><span class="texto-white">Smart</span><span class="text-gold">Control</span></span>
                </a>
            </div>

            <h1 class="h4 m-0 fw-normal d-none d-md-block texto-white">Dispositivos</h1>

            <div class="dropdown">
                <div class="cursor-pointer" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="assets/images/unnamed 2.jpg" alt="Foto de Perfil" class="avatar-perfil">
                </div>

                <div class="dropdown-menu dropdown-menu-end menu-perfil-card shadow mt-2">
                    <p class="mb-3 fw-normal small">Bem vindo(a),<br><strong class="fs-6">PiorAinda</strong></p>
                    <a href="perfil.usuario.html" class="btn-perfil-opcao"><i class="bi bi-person"></i> Perfil</a>
                    <a href="configuracoes.html" class="btn-perfil-opcao"><i class="bi bi-gear"></i> Configurações</a>
                    <a href="login.html" class="btn-perfil-opcao"><i class="bi bi-box-arrow-right"></i> Log Out</a>
                </div>
            </div>

        </div>
    </nav>

    <div class="offcanvas offcanvas-start offcanvas-amarelo" tabindex="-1" id="menuNavegacao" style="width: 280px;">
        <div class="offcanvas-header bg-dark text-white p-3">
            <h5 class="offcanvas-title fw-bold fs-4 m-0"><span class="texto-white">Smart</span><span class="text-gold">Control</span></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <div class="offcanvas-body d-flex flex-column gap-3 p-4">
            <a href="dashboard.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-grid-fill fs-5"></i> Início
            </a>
            <a href="dispositivos.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-display fs-5"></i> Dispositivos
            </a>
            <a href="perfis.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-broadcast fs-5"></i> Conexões
            </a>
            <a href="assistencia.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-flag fs-5"></i> Assistência
            </a>
            <a href="cenas.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-play-circle fs-5"></i> Cenas
                
            </a>
        </div>
    </div>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center my-4">
        <div class="lista-dispositivos-vertical d-flex flex-column gap-3 w-100" style="max-width: 480px;">
            
            <a href="camera.html" class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-camera-video-fill text-danger"></i></div>
                    <span class="fw-bold texto-nome">Câmera 01</span>
                </div>
                <span class="badge bg-success">Online</span>
            </a>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-tv-fill"></i></div>
                    <span class="fw-bold texto-nome">TV</span>
                </div>
                <span class="badge bg-secondary">Offline</span>
            </div>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-radioactive"></i></div>
                    <span class="fw-bold texto-nome">Rádio</span>
                </div>
                <span class="badge bg-success">Online</span>
            </div>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-lightbulb-fill text-warning"></i></div>
                    <span class="fw-bold texto-nome">Lâmpada</span>
                </div>
                <span class="badge bg-success">Online</span>
            </div>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-pc-display"></i></div>
                    <span class="fw-bold texto-nome">Computador</span>
                </div>
                <span class="badge bg-secondary">Offline</span>
            </div>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-phone-fill"></i></div>
                    <span class="fw-bold texto-nome">Smartphone</span>
                </div>
                <span class="badge bg-success">Online</span>
            </div>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-laptop"></i></div>
                    <span class="fw-bold texto-nome">Notebook</span>
                </div>
                <span class="badge bg-success">Online</span>
            </div>

            <div class="card-linha d-flex align-items-center justify-content-between p-2 px-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icone-dispositivo"><i class="bi bi-bluetooth text-primary"></i></div>
                    <span class="fw-bold texto-nome">Bluetooth</span>
                </div>
                <span class="badge bg-success">Conectado</span>
            </div>

            <button class="btn btn-secondary py-2 mt-2 w-100 d-flex align-items-center justify-content-center gap-2 rounded-3" type="button">
                <i class="bi bi-plus-lg fs-5"></i> Adicionar Dispositivo
            </button>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
