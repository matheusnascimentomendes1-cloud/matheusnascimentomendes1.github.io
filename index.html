<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário do Destino(formulário)</title>
</head>
<body>
    <form method="get">
        <label for ="nome_completo">Nome Completo:</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu Nome completo..." required>

        <label for="cpf">CPF:</label>
        <input type="text" name="cpf" id="cpf" placeholder="Digite sem pontuação..."  minlength="11" maxlength="11" required>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" minlength="8" maxlength="8">

        <label for="escolaridade">Escolaridade:</label>
        <select name="escolaridade" id="escolaridade">
            <option value="" selected >Informe sua Escolaridade</option>
            <option value="Ensino Primoridial Completo">Ensino Primoridial Completo</option>
            <option value="Ensino Médio Completo">Ensino Médio Completo</option>
            <option value="Ensino Superior Completo">Ensino Superior Completo</option>
        </select>
        <p>Informe sua Data De Nascimento:</p>
        <label for="date">Data De Nascimento:</label>
        <input type="date" name="date" id="date">

        <input type="checkbox" name="termos" id="termos">
        <label for="termos">Aceite os Termos do site</label>

        <input type="checkbox" name="condicoes" id="condicoes">
        <label for="condicoes">Aceite as Condições do site</label>

        <button type="submit">Enviar Formulário</button>
        <footer></footer>

    </form>
    
</body>
</html>
