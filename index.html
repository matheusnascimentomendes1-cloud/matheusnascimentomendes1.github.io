<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control Da Silva</title>
</head>
<body>
    <header>
        <h1>Smart Do Miranha</h1>
        <h2>Página de Cadastro</h2>
        <link rel="stylesheet" href="assets/css/style.css">
        <img src="assets/images/unnamed.jpg" alt="logo">    
    </header>
    <form action="dashboard.html" method="get">
        <label for ="nome_completo">Nome Completo:</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu Nome completo..." required>

        <label for="cpf">CPF:</label>
        <input type="text" name="cpf" id="cpf" placeholder="Digite sem pontuação..."  minlength="11" maxlength="11" required>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" minlength="8" required>

        <input type="checkbox" name="termos" id="termos">
        <label for="termos">Aceite os Termos do site</label>

        <input type="checkbox" name="condicoes" id="condicoes">
        <label for="condicoes" >Aceite as Condições do site</label>

        <button type="submit">Entrar /Ir para o Dashboard</button>
      
        <footer></footer>
    </form>   
<a href="Login.html">Faça Login</a>
    
</body>
</html>
