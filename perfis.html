<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">

</head>
<body>

   <nav class="navbar navbar-dark bg-dark-header px-4 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <button class="btn text-white p-0 fs-3 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPerfil">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-2 m-0 cursor-pointer" href="#" data-bs-toggle="offcanvas" data-bs-target="#menuPerfil">
                    <span class="fw-bold fs-4"><span class="texto-smart">Smart</span><span class="text-gold">Control</span></span>
                </a>
            </div>

            <h1 class="h4 texto-adaptavel m-0 fw-normal d-none d-md-block">Início</h1>

            <div class="d-flex align-items-center gap-3">
                <button type="button" class="btn btn-outline-warning btn-sm icon-center gap-2" id="btn-toggle-theme">
                    <i class="bi bi-moon-stars" id="icone-botao-tema"></i>
                    <span id="texto-botao-tema" class="d-none d-sm-inline">Modo Escuro</span>
                </button>

                <div class="cursor-pointer" data-bs-toggle="offcanvas" data-bs-target="#menuPerfil">
                    <img src="assets/images/unnamed 2.jpg" alt="Foto de Perfil" id="foto-perfil-nav" class="avatar-perfil">
                </div>
            </div>

        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="menuPerfil">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title texto-adaptavel"><i class="bi bi-person-circle me-2"></i>Perfil do Usuário</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <div>
                <div class="text-center my-3">
                    <img src="assets/images/unnamed 2.jpg" alt="Foto de Perfil" class="avatar-perfil-lg mb-2">
                    <h6 class="fw-bold mb-0 texto-adaptavel" id="perfil-nome">Carregando...</h6>
                    <small class="text-muted" id="perfil-email">email@exemplo.com</small>
                </div>

                <hr>

                <div class="d-flex align-items-center justify-content-between py-2">
                    <span class="d-flex align-items-center gap-2 texto-adaptavel">
                        <i class="bi bi-moon-stars fs-5" id="icone-tema"></i> Alternar Tema
                    </span>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" id="switch-tema" role="switch">
                    </div>
                </div>
            </div>

            <div class="pb-3">
                <button id="btn-logout" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-right"></i> Sair da Conta
                </button>
            </div>
        </div>
    </div>

    <main class ="container"
</body>
</html>
