<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Indisponível</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #383838; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .bg-dark-header { background-color: #000; }

        .error-wrapper {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            background-color: #4a4a4a;
            max-width: 480px;
            width: 100%;
            border-radius: 12px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .icon-box {
            font-size: 3.5rem;
            color: #ffda44;
            margin-bottom: 15px;
        }

        .btn-gold {
            background-color: #ffda44;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            padding: 8px 20px;
            border: none;
            text-decoration: none;
            display: inline-block;
        }

        .btn-gold:hover {
            background-color: #e6c43d;
            color: #000;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark-header px-4 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button class="btn text-white p-0 fs-3 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
                    <span class="fw-bold fs-4"><span class="text-white">Smart</span><span style="color: #ffda44;">Control</span></span>
                </a>
            </div>
            <a href="javascript:history.back()" class="btn text-white fs-4 p-0"><i class="bi bi-arrow-left-circle"></i></a>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start border-0" tabindex="-1" id="menuLateral" style="background-color: #ffda44; width: 280px;">
        <div class="offcanvas-header bg-dark text-white py-3 px-3">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-dark p-1 border-0" type="button" data-bs-dismiss="offcanvas">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <span class="fw-bold fs-4">Smart<span style="color: #ffda44;">Control</span></span>
            </div>
        </div>
        <div class="offcanvas-body p-3 d-flex flex-column gap-3">
            <a href="index.html" class="btn text-start py-2 px-3 rounded-3 d-flex align-items-center gap-3 shadow-sm border-0" style="background-color: #383838; color: #fff;"><i class="bi bi-grid-fill fs-5"></i><span>Início</span></a>
            <a href="dispositivos.html" class="btn text-start py-2 px-3 rounded-3 d-flex align-items-center gap-3 shadow-sm border-0" style="background-color: #383838; color: #fff;"><i class="bi bi-tv fs-5"></i><span>Dispositivos</span></a>
            <a href="perfis.html" class="btn text-start py-2 px-3 rounded-3 d-flex align-items-center gap-3 shadow-sm border-0" style="background-color: #383838; color: #fff;"><i class="bi bi-broadcast fs-5"></i><span>Conexões</span></a>
            <a href="assistencia.html" class="btn text-start py-2 px-3 rounded-3 d-flex align-items-center gap-3 shadow-sm border-0" style="background-color: #383838; color: #fff;"><i class="bi bi-flag fs-5"></i><span>Assistência</span></a>
            <a href="cenas.html" class="btn text-start py-2 px-3 rounded-3 d-flex align-items-center gap-3 shadow-sm border-0" style="background-color: #383838; color: #fff;"><i class="bi bi-play-triangle fs-5"></i><span>Cenas</span></a>
        </div>
    </div>

    <div class="error-wrapper">
        <div class="error-card">
            <div class="icon-box">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h4 class="fw-bold mb-2">Serviço Indisponível</h4>
            <p class="text-white-50 small mb-4">
                Esta funcionalidade não está funcionando no momento ou se encontra em manutenção. Tente novamente mais tarde.
            </p>
            <a href="dashboard.html" class="btn-gold">Voltar ao Início</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
