<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Perfil do Usuário</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #1a1d21;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .bg-dark-header { 
            background-color: #000000; 
        }

        .text-gold { 
            color: #ffc107; 
        }

        .offcanvas-amarelo {
            background-color: #f7d038 !important;
            color: #000000 !important;
        }

        .btn-menu-navegacao {
            background-color: #3b3b3b;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 500;
            text-align: left;
            transition: background-color 0.2s;
            border: none;
        }

        .btn-menu-navegacao:hover {
            background-color: #262626;
            color: #ffffff;
        }

        .perfil-container {
            width: 100%;
            max-width: 480px;
            background-color: #43464b;
            min-height: calc(100vh - 56px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .banner-perfil {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .wrapper-foto {
            position: relative;
            height: 40px;
        }

        .foto-perfil {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b3b3b;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .card-casa {
            width: 100%;
            max-width: 280px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            border: 1px solid #555;
        }

        .img-casa {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-voltar {
            color: #ffffff;
            font-size: 1.5rem;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-voltar:hover {
            color: #ffc107;
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center">

    <nav class="navbar navbar-dark bg-dark-header w-100 px-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <button class="btn text-white p-0 fs-3 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuNavegacao">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-1 m-0">
                    <span class="fw-bold fs-4"><span class="text-white">Smart</span><span class="text-gold">Control</span></span>
                </a>
            </div>

            <a href="javascript:history.back()" class="btn-voltar" title="Voltar">
                <i class="bi bi-arrow-left-circle"></i>
            </a>

        </div>
    </nav>

    <div class="offcanvas offcanvas-start offcanvas-amarelo" tabindex="-1" id="menuNavegacao" style="width: 280px;">
        <div class="offcanvas-header bg-dark text-white p-3">
            <h5 class="offcanvas-title fw-bold fs-4 m-0"><span class="text-white">Smart</span><span class="text-gold">Control</span></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <div class="offcanvas-body d-flex flex-column gap-3 p-4">
            <a href="dashboard.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-grid-fill fs-5"></i> Início
            </a>
            <a href="dispositivos.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-display fs-5"></i> Dispositivos
            </a>
            <a href="perfis.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-broadcast fs-5"></i> Conexões
            </a>
            <a href="assistencia.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-flag fs-5"></i> Assistência
            </a>
            <a href="cenas.html" class="btn-menu-navegacao text-decoration-none d-flex align-items-center gap-3">
                <i class="bi bi-play-circle fs-5"></i> Cenas
            </a>
        </div>
    </div>

    <main class="perfil-container flex-grow-1 d-flex flex-column">
        
        <img src="assets/images/unnamed.tobias.gif" alt="Banner" class="banner-perfil">

        <div class="wrapper-foto">
            <img src="assets/images/unnamed 2.jpg" alt="Foto de Perfil" class="foto-perfil">
        </div>

        <div class="px-4 pb-4 pt-2 d-flex flex-column align-items-start">
            
            <h2 class="w-100 text-center fs-4 fw-bold mb-4">Th3usツ</h2>

            <div class="mb-4">
                <span class="text-secondary small d-block mb-1">Bio</span>
                <p class="fw-medium mb-0" style="font-size: 0.95rem; line-height: 1.4;">
                    Às vezes, para fazer a coisa certa, é preciso ser firme e desistir daquilo que mais queremos. Até dos nossos sonhos.
                </p>
            </div>

            <div class="w-100">
                <span class="text-secondary small d-block mb-2">Casas</span>
                
                <div class="d-flex flex-column align-items-start">
                    <div class="card-casa shadow-sm mb-1">
                        <img src="assets/images/casa1.png" alt="Dashboard Casa 1" class="img-casa">
                    </div>
                    <span class="small text-white-50">Casa1</span>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
